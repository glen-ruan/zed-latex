name: Check extension
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Zed extension WASM
        run: cargo build --locked --target wasm32-wasip2
      - name: Check companion service
        run: node tests/workshop-probe.cjs
        env:
          SKIP_TEX_BUILD: '1'
      - name: Check PDF recovery
        run: node tests/recovery-probe.cjs
      - name: Check tool discovery
        run: node tests/tools-probe.cjs
      - name: Check reference edits
        run: node tests/references-probe.cjs
      - name: Check source structure
        run: node tests/structure-probe.cjs
      - name: Check configuration reports
        run: node tests/config-check-probe.cjs
      - name: Check TeX log locations
        run: node tests/tex-log-probe.cjs
      - name: Check modern document commands
        run: node tests/document-commands-probe.cjs

      - name: Check static macro wrappers
        run: node tests/wrappers-probe.cjs
      - name: Check file path contexts
        run: node tests/paths-probe.cjs
      - name: Check class module navigation
        run: node tests/navigation-probe.cjs

      - name: Check build diagnostic ownership
        run: node tests/build-diagnostics-probe.cjs

      - name: Check source index caching
        run: node tests/source-cache-probe.cjs

      - name: Check special declarations and aliases
        run: node tests/declarations-probe.cjs
