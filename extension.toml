id = "latex"
name = "LaTeX Workshop for Zed"
version = "0.4.20"
schema_version = 1
snippets = ["snippets/latex.json"]
authors = [
    "Ruben Zukic <ruben@zukic.net>",
    "Oli Callaghan <me@olicallaghan.com>",
    "Luke Naylor <luke.naylr@gmail.com>",
    "Jan Solanti <jhs@psonet.com>",
]
description = "Workshop-style editing, recipes, root discovery and XeLaTeX builds for Zed."
repository = "https://github.com/glen-ruan/zed-latex"

[language_servers.latex-workshop]
name = "LaTeX Workshop companion"
languages = ["LaTeX", "BibTeX"]

[language_servers.latex-workshop.language_ids]
LaTeX = "latex"
BibTeX = "bibtex"

[grammars.bibtex]
repository = "https://github.com/latex-lsp/tree-sitter-bibtex"
commit = "ccfd77db0ed799b6c22c214fe9d2937f47bc8b34"

[grammars.latex]
repository = "https://github.com/glen-ruan/zed-latex"
commit = "33517da106283e03bc89d179881923643e0e6939"
path = "parser/latex"

[grammars.bibtex_style]
repository = "https://github.com/glen-ruan/zed-latex"
commit = "7bfcc72308be076c6d79d32a157f273ade691e1d"
path = "parser/bibtex_style"
